name: bygg og publiser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/adfunc-as/pearl-defjob

jobs:
  bygg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck entrypoint.sh

      - name: Bygg
        run: docker build --pull -t "$IMAGE:1" -t "$IMAGE:sha-${GITHUB_SHA::12}" .

      # Uten GPU og uten ekte miner: sjekker at skriptet nekter å starte uten argumenter, at bildet ikke kjører som root,
      # at en miner med riktig hash godkjennes og at en med feil hash avvises.
      - name: Røyktest
        run: |
          set -eu
          rc=0; docker run --rm "$IMAGE:1" || rc=$?
          [ "$rc" -eq 64 ] || { echo "forventet kode 64 uten argumenter, fikk $rc"; exit 1; }
          [ "$(docker run --rm --entrypoint id "$IMAGE:1" -u)" = 10001 ] || { echo "bildet kjører som root"; exit 1; }
          t="$(mktemp -d)"
          printf '#!/bin/bash\nexit 0\n' > "$t/fakeminer"
          chmod 755 "$t" && chmod 644 "$t/fakeminer"
          sha="$(sha256sum "$t/fakeminer" | cut -d' ' -f1)"
          docker run --rm -e PEARL_ALLOW_FILE=1 -v "$t:/t:ro" "$IMAGE:1" --selftest \
            --miner-url file:///t/fakeminer --miner-sha256 "$sha" --miner-bin fakeminer --miner-args x
          rc=0
          docker run --rm -e PEARL_ALLOW_FILE=1 -v "$t:/t:ro" "$IMAGE:1" --selftest \
            --miner-url file:///t/fakeminer --miner-sha256 "$(printf 'b%.0s' $(seq 64))" --miner-bin fakeminer --miner-args x || rc=$?
          [ "$rc" -eq 65 ] || { echo "feil hash skulle gitt kode 65, fikk $rc"; exit 1; }
          # Profiler: miner og pool festet i bildet, så vast-malen bare trenger profilnavn og adresse (args-feltet tar maks 256 tegn).
          p="$(mktemp -d)"
          printf 'MINER_URL=file:///t/fakeminer\nMINER_SHA256=%s\nMINER_BIN=fakeminer\nMINER_ARGS=--user {ADDRESS}/{WORKER}\n' "$sha" > "$p/fake.env"
          chmod 755 "$p" && chmod 644 "$p/fake.env"
          addr=prl1pqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq
          docker run --rm -e PEARL_ALLOW_FILE=1 -e PEARL_PROFILE_DIR=/p -v "$t:/t:ro" -v "$p:/p:ro" "$IMAGE:1" \
            --profile fake --address "$addr" --selftest
          rc=0; docker run --rm "$IMAGE:1" --profile krig-1.5.12-kryptex --address prl1bad --selftest || rc=$?
          [ "$rc" -eq 64 ] || { echo "ugyldig adresse skulle gitt kode 64, fikk $rc"; exit 1; }
          rc=0; docker run --rm "$IMAGE:1" --profile finnes-ikke --address "$addr" --selftest || rc=$?
          [ "$rc" -eq 64 ] || { echo "ukjent profil skulle gitt kode 64, fikk $rc"; exit 1; }
          n="$(docker run --rm --entrypoint grep "$IMAGE:1" -c '^MINER_SHA256=[0-9a-f]\{64\}$' /usr/local/share/pearl/profiles/krig-1.5.12-kryptex.env)"
          [ "$n" = 1 ] || { echo "profilen krig-1.5.12-kryptex mangler en gyldig SHA-256"; exit 1; }

      - name: Publiser
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:1"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          digest="$(docker image inspect "$IMAGE:1" --format '{{index .RepoDigests 0}}')"
          echo "Publisert: $digest"
          echo "Publisert: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
